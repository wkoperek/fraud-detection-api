# HighAmountRule config. Thresholds are in USD; the request carries no currency.
risk.high-amount.medium-threshold=1000
risk.high-amount.high-threshold=5000

# quarkus settings

# error messages in English
quarkus.default-locale=en

# disable Quarkus's built-in mapper so ApiExceptionMappers returns MALFORMED_REQUEST for wrong JSON types
quarkus.rest.exception-mapping.disable-mapper-for=io.quarkus.resteasy.reactive.jackson.runtime.mappers.BuiltinMismatchedInputExceptionMapper

# console log format: request id from MDC
quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%X{requestId}] [%c{2.}] %s%e%n

# access log: one line per request, including 401 (caller is %u, request id comes from the response header)
quarkus.http.access-log.enabled=true
quarkus.http.record-request-start-time=true
quarkus.http.access-log.pattern=%h %u %t "%r" %s %D %{o,X-REQUESTID}
%dev.quarkus.log.category."com.koperek".level=DEBUG

# JWT verification (tokens are minted outside the service, it only verifies them)
mp.jwt.verify.publickey.location=publicKey.pem
mp.jwt.verify.issuer=https://fraud-detection-api.example/issuer
mp.jwt.verify.audiences=fraud-detection-api

# Mastercard BIN Look Up client (credentials come from MASTERCARD_* environment variables, test values from WireMockResource)
quarkus.rest-client.bin-lookup.url=https://sandbox.api.mastercard.com/bin-resources
quarkus.rest-client.bin-lookup.connect-timeout=2000
quarkus.rest-client.bin-lookup.read-timeout=3000
# cache defaults for all caches (BIN lookup: found and not found results; failures are never cached)
quarkus.cache.caffeine.expire-after-write=15M
quarkus.cache.caffeine.maximum-size=10000