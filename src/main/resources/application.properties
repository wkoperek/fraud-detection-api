
# HighAmountRule config
risk.high-amount.medium-threshold=1000
risk.high-amount.high-threshold=5000

# quarkus settings
# error messages in English
quarkus.default-locale=en
# disable Quarkus's built-in mapper so ApiExceptionMappers returns MALFORMED_REQUEST for wrong JSON types
quarkus.rest.exception-mapping.disable-mapper-for=io.quarkus.resteasy.reactive.jackson.runtime.mappers.BuiltinMismatchedInputExceptionMapper